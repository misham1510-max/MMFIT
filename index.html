<title>ММ.ФИТНЕС</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --lime:#9acd32; --lime-ink:#0a0a0a; --lime-soft:rgba(154,205,50,.16);
  --bg:#ffffff; --surface:#f3f4f0; --surface-2:#e8eae3; --text:#000000; --muted:#5d6158; --line:#dcdfd6;
  --lime-text:#4d7a00; --danger:#d23b2b;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --surface:#151614; --surface-2:#22241f; --text:#ffffff; --muted:#a2a69c; --line:#2d302a;
    --lime-text:#9acd32; --danger:#ff6b5b; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#151614; --surface-2:#22241f; --text:#ffffff; --muted:#a2a69c; --line:#2d302a;
  --lime-text:#9acd32; --danger:#ff6b5b; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation}
button:disabled{opacity:.35;cursor:default}
:focus-visible{outline:3px solid var(--lime);outline-offset:2px;border-radius:6px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 140px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:14px 0 10px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-family:Unbounded,"Arial Black",sans-serif;font-weight:800;font-size:22px;letter-spacing:-.02em;display:flex;align-items:baseline}
.logo .dot{display:inline-block;width:9px;height:9px;background:var(--lime);border-radius:2px;margin:0 3px;transform:translateY(-1px)}
.sync{font-size:12px;color:var(--muted)}

nav.tabs{display:flex;gap:6px;background:var(--surface);padding:4px;border-radius:14px;margin:4px 0 20px}
nav.tabs button{flex:1;padding:10px 6px;border-radius:10px;font-weight:700;font-size:14px;color:var(--muted)}
nav.tabs button[aria-selected="true"]{background:var(--text);color:var(--bg)}

h1,h2{font-family:Unbounded,"Arial Black",sans-serif;letter-spacing:-.02em;margin:0}
h1{font-size:26px;line-height:1.15}
h2{font-size:18px}
.muted{color:var(--muted)}
.small{font-size:13px}

/* Day cards */
.day{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:stretch;background:var(--surface);border-radius:18px;padding:14px;margin-bottom:12px;position:relative}
.day.today{background:var(--lime);color:var(--lime-ink)}
.day.today .muted{color:rgba(0,0,0,.65)}
.day .dow{font-family:Unbounded,sans-serif;font-weight:800;font-size:26px;display:flex;flex-direction:column;justify-content:center;align-items:center;border-radius:12px;background:var(--bg);color:var(--text)}
.day.today .dow{background:var(--lime-ink);color:var(--lime)}
.day .dow small{font-family:Manrope,sans-serif;font-size:11px;font-weight:700;opacity:.7}
.day .meta h2{font-size:16px;margin-bottom:2px}
.day .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:12px;font-weight:800;font-size:15px;min-height:44px}
.btn-lime{background:var(--lime);color:var(--lime-ink)}
.btn-dark{background:var(--text);color:var(--bg)}
.day.today .btn-dark{background:var(--lime-ink);color:var(--lime)}
.btn-ghost{background:transparent;border:2px solid var(--line);color:var(--text)}
.day.today .btn-ghost{border-color:rgba(0,0,0,.25);color:var(--lime-ink)}
.btn-danger{color:var(--danger);border:2px solid var(--line)}
.btn-block{width:100%}

/* Session */
.session-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:16px}
.clock{font-family:Unbounded,sans-serif;font-weight:800;font-size:34px;font-variant-numeric:tabular-nums;line-height:1}
.ex{background:var(--surface);border-radius:18px;margin-bottom:10px;overflow:hidden;border:2px solid transparent}
.ex.done{border-color:var(--lime)}
.ex-head{display:grid;grid-template-columns:1fr 72px;gap:12px;align-items:center;padding:12px 12px 12px 16px;width:100%;text-align:left}
.ex-head h3{margin:0 0 3px;font-size:17px;font-weight:800;line-height:1.25}
.ex-head .sum{font-size:14px;color:var(--muted)}
.ex.done .ex-head h3::after{content:" ✓";color:var(--lime-text)}
.photo{width:72px;height:72px;border-radius:12px;background:var(--surface-2);overflow:hidden;display:flex;align-items:center;justify-content:center;flex:none}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo svg{width:40px;height:40px;color:var(--muted)}
.photo svg.pic{width:92%;height:92%;color:var(--text)}
.pic circle{fill:currentColor;stroke:none}
.pic .k{stroke:var(--lime-text);stroke-width:3}
.ed-mid{display:flex;flex-direction:column;gap:6px}
.ed-mid select{min-height:36px;border-radius:8px;border:2px solid var(--line);background:var(--bg);color:var(--text);padding:4px 8px;font:inherit;font-size:16px;font-weight:700}
.ex-body{padding:0 12px 14px}
.last{font-size:13px;color:var(--muted);margin:0 4px 10px}
.set{display:grid;grid-template-columns:28px 1fr 1fr 48px 36px;gap:8px;align-items:center;margin-bottom:8px;padding:6px;border-radius:12px}
.set.ok{background:var(--lime-soft)}
.set .n{font-weight:800;text-align:center;color:var(--muted)}
.field{position:relative}
.field input{width:100%;min-height:44px;border-radius:10px;border:2px solid var(--line);background:var(--bg);padding:8px 34px 8px 10px;font-weight:800;font-size:17px;font-variant-numeric:tabular-nums}
.field input:focus{border-color:var(--lime);outline:none}
.field span{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--muted);pointer-events:none}
.check{width:48px;height:44px;border-radius:10px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:var(--muted)}
.set.ok .check{background:var(--lime);border-color:var(--lime);color:var(--lime-ink)}
.del{width:36px;height:44px;color:var(--muted);font-size:20px;border-radius:10px}
.del:hover{color:var(--danger)}
.badge{display:inline-block;background:var(--lime);color:var(--lime-ink);font-weight:800;font-size:11px;border-radius:6px;padding:2px 6px;margin-left:6px;vertical-align:middle}
.row-acts{display:flex;gap:8px;margin-top:6px}
.row-acts .btn{flex:1}
.set-head{display:grid;grid-template-columns:28px 1fr 1fr 48px 36px;gap:8px;padding:0 6px;font-size:12px;color:var(--muted);margin-bottom:4px}

/* Rest timer */
.rest{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--text);color:var(--bg);padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));display:none}
.rest.on{display:block}
.rest .in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:14px}
.rest .t{font-family:Unbounded,sans-serif;font-weight:800;font-size:32px;font-variant-numeric:tabular-nums;color:var(--lime);min-width:104px}
.rest .lbl{flex:1;font-weight:700;font-size:14px;line-height:1.3}
.rest .bar{height:4px;background:rgba(127,127,127,.35);border-radius:2px;margin-top:6px;overflow:hidden}
.rest .bar i{display:block;height:100%;background:var(--lime);width:100%}
.rest button{border:2px solid rgba(127,127,127,.45);border-radius:10px;padding:8px 10px;font-weight:800;font-size:14px;color:var(--bg);min-height:40px}
.rest.over .t{color:var(--bg)}
.rest.over{background:var(--lime);color:var(--lime-ink)}
.rest.over .t,.rest.over button{color:var(--lime-ink)}

.finish-bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 30%);z-index:15}
.finish-bar .in{max-width:560px;margin:0 auto}

/* History / records / summary */
.card{background:var(--surface);border-radius:18px;padding:14px 16px;margin-bottom:10px}
.hist-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;width:100%;text-align:left}
.hist-head b{font-size:16px}
.kv{display:flex;gap:18px;margin:8px 0 2px;flex-wrap:wrap}
.kv div{font-size:13px;color:var(--muted)}
.kv b{display:block;font-size:20px;color:var(--text);font-family:Unbounded,sans-serif;font-variant-numeric:tabular-nums}
.hist-ex{border-top:1px solid var(--line);padding:10px 0 4px;font-size:14px}
.hist-ex b{display:block}
.rec{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.rec:last-child{border-bottom:0}
.rec .w{font-family:Unbounded,sans-serif;font-weight:800;font-size:18px;text-align:right}
.rec .w small{display:block;font-family:Manrope,sans-serif;font-weight:600;font-size:12px;color:var(--muted)}
.big-done{background:var(--lime);color:var(--lime-ink);border-radius:22px;padding:22px 20px;margin-bottom:14px}
.big-done .clock{font-size:48px;margin:10px 0 4px}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}

/* Editor */
.ed-row{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.ed-row .photo{width:56px;height:56px}
.ed-row input,.text-in{width:100%;min-height:44px;border-radius:10px;border:2px solid var(--line);background:var(--bg);padding:8px 10px;font-weight:700}
.ed-row input:focus,.text-in:focus{border-color:var(--lime);outline:none}
.mini{display:flex;gap:2px}
.mini button{width:34px;height:40px;border-radius:8px;color:var(--muted);font-size:17px}
.mini button:hover{background:var(--surface-2);color:var(--text)}
.back{font-weight:700;color:var(--muted);padding:8px 0;margin-bottom:6px;display:inline-block}
label.lbl{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px;font-weight:700}

.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
.wk{background:var(--surface);border-radius:16px;margin-bottom:8px;border:2px solid transparent}
.wk.cur{border-color:var(--lime)}
.wk-head{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 14px}
.dots{display:flex;gap:5px;flex:none}
.dd{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;background:var(--bg);color:var(--muted);border:2px solid var(--line)}
.dd.ok{background:var(--lime);border-color:var(--lime);color:var(--lime-ink)}
.dd.miss{opacity:.45;text-decoration:line-through}
.badge.dark{background:var(--text);color:var(--bg)}
.wk-day{padding:4px 14px 10px}
.wk-day > b{display:block;font-size:14px;margin:6px 0 4px}
.wk-ex{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:5px 0;border-bottom:1px solid var(--line)}
.wk-ex span:last-child{font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
nav.tabs button{font-size:13px;padding:10px 4px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:-6px 0 8px}
.stat{background:var(--surface);border-radius:14px;padding:10px 6px;text-align:center}
.stat b{display:block;font-family:Unbounded,"Arial Black",sans-serif;font-size:20px;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:12px;color:var(--muted);font-weight:700}
.stat.hl{background:var(--lime);color:var(--lime-ink)}
.stat.hl span{color:rgba(0,0,0,.65)}
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.modal.on{display:flex}
.modal .box{background:var(--bg);color:var(--text);border-radius:20px;padding:20px;width:100%;max-width:440px}
.modal p{margin:0 0 16px;font-weight:700;font-size:17px}
.modal .row-acts .btn{flex:1}
</style>

<body>
<div class="wrap">
  <header class="top">
    <button class="logo" data-tab="home" aria-label="На главную">ММ<span class="dot"></span>ФИТНЕС</button>
    <div class="sync" id="sync">Загрузка…</div>
  </header>
  <main id="app"></main>
</div>
<div class="rest" id="rest" role="timer" aria-live="polite">
  <div class="in">
    <div class="t" id="restT">2:00</div>
    <div class="lbl"><span id="restL">Отдых</span><div class="bar"><i id="restBar"></i></div></div>
    <button id="restPlus" type="button">+30с</button>
    <button id="restSkip" type="button">Готов</button>
  </div>
</div>
<input type="file" id="photoInput" accept="image/*" hidden>
<input type="file" id="backupInput" accept=".json,application/json,text/plain" hidden>
<div class="toast" id="toast"></div>
<div class="modal" id="modal" role="dialog" aria-modal="true"><div class="box"><p id="modalText"></p><div class="row-acts"><button class="btn btn-ghost" id="modalNo" type="button">Нет</button><button class="btn btn-lime" id="modalYes" type="button">Да</button></div></div></div>

<script>
(function(){
"use strict";
const LS_KEY = "mmfit_v1";
const REST_SET = 60, REST_EX = 120;
const DAYS = [
  {id:"mon", short:"Пн", full:"Понедельник", wd:1},
  {id:"wed", short:"Ср", full:"Среда", wd:3},
  {id:"fri", short:"Пт", full:"Пятница", wd:5}
];
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
const PROGRAM_VERSION = 3;
const mk = (name, icon, n, r, w, rest, plan) => ({id:uid(), name, icon, rest:rest||60, plan:plan||null, sets:Array.from({length:n||4},()=>({w:w==null?"":String(w), r:String(r||10)}))});

function defaultState(){
  return {
    program:{
      mon:{name:"Тяжёлый день", exercises:[
        mk("Приседания со штангой","squat",5,5,50,165,{start:50,target:75,sets:5,reps:5,test:true}),
        mk("Жим штанги лёжа","bench",5,5,55,165,{start:55,target:70,sets:5,reps:5,test:true}),
        mk("Тяга штанги в наклоне","row",4,8,40,120,{start:40,target:55,sets:4,reps:8}),
        mk("Жим гантелей на наклонной скамье","incline",3,8,14,90,{start:14,target:20,sets:3,reps:8,step:2}),
        mk("Подъём штанги на бицепс","curl",3,10,20,60,{start:20,target:27.5,sets:3,reps:10})]},
      wed:{name:"Спина и плечи", exercises:[
        mk("Румынская тяга со штангой","rdl",4,8,40,120,{start:40,target:70,sets:4,reps:8}),
        mk("Жим штанги стоя (армейский)","ohp",4,6,30,120,{start:30,target:40,sets:4,reps:6}),
        mk("Подтягивания","pullup",5,7,"",90,{kind:"reps",start:7,target:10,sets:5,testSets:3,testReps:12}),
        mk("Жим ногами в тренажёре Matrix","legpress",4,10,"",90),
        mk("Разгибание рук на верхнем блоке","pushdown",4,10,"",60)]},
      fri:{name:"Объёмный день", exercises:[
        mk("Приседания со штангой (объём)","squat",4,8,42.5,120,{start:42.5,target:62.5,sets:4,reps:8}),
        mk("Жим штанги лёжа (объём)","bench",4,8,47.5,120,{start:47.5,target:60,sets:4,reps:8}),
        mk("Горизонтальная тяга в тренажёре Matrix","seatrow",4,10,"",90),
        mk("Выпады с гантелями","lunge",3,10,10,90,{start:10,target:16,sets:3,reps:10,step:2}),
        mk("Обратные разведения в тренажёре Matrix","rfly",4,12,"",60)]}
    },
    planStart:weekStart(),
    programVersion:PROGRAM_VERSION,
    records:{},   // exId -> {w,r,date,name}
    history:[],   // newest first
    photos:{},    // exId -> dataURL
    active:null
  };
}

let S = defaultState();
let view = {tab:"home", openEx:null, editDay:null, summaryId:null, openHist:null};
let db = null, base = null;

/* ---------- storage ---------- */
function lsSave(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){} }
function lsLoad(){ try{ const v = localStorage.getItem(LS_KEY); return v ? JSON.parse(v) : null; }catch(e){ return null; } }
function setSync(t){ document.getElementById("sync").textContent = t; }

let mainTimer = null;
function saveMain(){
  lsSave();
  if(!db) return;
  clearTimeout(mainTimer);
  mainTimer = setTimeout(async ()=>{
    try{
      await db.doc(base+"/main").set({program:S.program, records:S.records, programVersion:S.programVersion||1, planStart:S.planStart||null});
      await db.doc(base+"/active").set({session:S.active ? JSON.stringify(S.active) : ""});
      setSync("Сохранено");
    }catch(e){ setSync("Сохранено на устройстве"); }
  }, 500);
}
async function saveHistoryEntry(h){
  lsSave();
  if(db) try{ await db.doc(base+"/h_"+h.id).set({entry:JSON.stringify(h), ts:h.start}); }catch(e){}
}
async function deleteHistoryEntry(id){
  lsSave();
  if(db) try{ await db.doc(base+"/h_"+id).delete(); }catch(e){}
}
async function savePhoto(exId){
  lsSave();
  if(db) try{ await db.doc(base+"/p_"+exId).set({src:S.photos[exId]||""}); }catch(e){}
}

async function init(){
  const local = lsLoad();
  if(local){ S = Object.assign(defaultState(), local); S.programVersion = local.programVersion||1; }
  migrate();
  if(S.active) view.tab = "session";
  render();
  try{
    if(!window.claude || !window.claude.use) throw 0;
    const user = await window.claude.use("user");
    const d = await window.claude.use("db");
    const id = user ? await user.id() : null;
    if(!d || !id) throw 0;
    db = d; base = "data/users/"+id;
    const snap = await db.collection(base).get();
    const docs = snap.docs || [];
    if(docs.length === 0){
      // first run in cloud: push whatever we have
      await db.doc(base+"/main").set({program:S.program, records:S.records});
      for(const h of S.history) await saveHistoryEntry(h);
      for(const k in S.photos) await savePhoto(k);
    }else{
      const hist = [], photos = {};
      for(const doc of docs){
        const key = doc.id || (doc.ref && doc.ref.id) || "";
        const v = doc.data ? doc.data() : null; if(!v) continue;
        if(key === "main"){ if(v.program) S.program = v.program; if(v.records) S.records = v.records; S.programVersion = v.programVersion||1; if(v.planStart) S.planStart = v.planStart; }
        else if(key === "active"){ S.active = v.session ? JSON.parse(v.session) : null; }
        else if(key.startsWith("h_")){ try{ hist.push(JSON.parse(v.entry)); }catch(e){} }
        else if(key.startsWith("p_")){ if(v.src) photos[key.slice(2)] = v.src; }
      }
      hist.sort((a,b)=>b.start-a.start);
      S.history = hist; S.photos = photos;
      lsSave();
      migrate();
    }
    setSync("Сохранено в облаке");
  }catch(e){
    setSync("Сохранено на устройстве");
  }
  if(S.active && view.tab==="home") view.tab = "session";
  render(); keepAwake();
}

function migrate(){
  if((S.programVersion||1) < PROGRAM_VERSION){
    const byName = {};
    for(const k in S.program) for(const e of S.program[k].exercises) byName[e.name] = e.id;
    const np = defaultState().program;
    for(const k in np) for(const e of np[k].exercises) if(byName[e.name]) e.id = byName[e.name];
    S.program = np; S.programVersion = PROGRAM_VERSION; S.planStart = weekStart(); saveMain();
  }
}
/* ---------- 12-week plan ---------- */
const PLAN_WEEKS = 12, DELOAD = 7, PROG_WEEKS = [1,2,3,4,5,6,8,9,10,11,12];
function planWeek(at){
  if(!S.planStart) return null;
  const w = Math.floor(((at||Date.now()) - S.planStart)/(7*864e5)) + 1;
  return w < 1 ? 1 : (w > PLAN_WEEKS ? null : w);
}
function planFor(e, wk){
  const pl = e.plan; if(!pl || !wk) return null;
  const step = pl.step || 2.5, rnd = v => Math.round(v/step)*step;
  const lin = k => pl.start + (pl.target - pl.start)*k/10;
  let sets = pl.sets, v;
  if(wk === DELOAD){ sets = Math.max(2, sets-1); v = pl.kind==="reps" ? Math.max(3, Math.round(lin(5))-2) : rnd(lin(5)*0.8); }
  else v = pl.kind==="reps" ? Math.round(lin(PROG_WEEKS.indexOf(wk))) : rnd(lin(PROG_WEEKS.indexOf(wk)));
  if(wk === PLAN_WEEKS && pl.test) sets = 1;
  if(wk === PLAN_WEEKS && pl.kind==="reps" && pl.testSets){ sets = pl.testSets; v = pl.testReps; }
  return pl.kind==="reps" ? {sets, r:v, w:""} : {sets, r:pl.reps, w:v};
}
const weekTag = wk => wk===DELOAD ? "разгрузка" : wk===PLAN_WEEKS ? "проверка" : "";
function planText(e, wk){
  const p = planFor(e, wk); if(!p) return "вес подбираешь сам";
  return p.w==="" ? `${p.sets} × ${p.r}` : `${p.sets} × ${p.r} · ${fmtW(p.w)} кг`;
}

/* ---------- helpers ---------- */
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => { const n = parseFloat(String(v).replace(",",".")); return isFinite(n) ? n : 0; };
const fmtW = v => { const n = num(v); return (Math.round(n*100)/100).toString().replace(".",","); };
function fmtDur(ms){
  const s = Math.max(0,Math.floor(ms/1000)), h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60;
  return h ? `${h}:${String(m).padStart(2,"0")}:${String(x).padStart(2,"0")}` : `${m}:${String(x).padStart(2,"0")}`;
}
function fmtDate(ts){ return new Date(ts).toLocaleDateString("ru-RU",{weekday:"short", day:"numeric", month:"long"}); }
function better(a,b){ // is set a better than record b
  if(!b) return true;
  if(num(a.w) !== num(b.w)) return num(a.w) > num(b.w);
  return num(a.r) > num(b.r);
}
function bestSet(sets){
  let best = null;
  for(const s of sets) if(s.done && (num(s.w)>0 || num(s.r)>0) && better(s, best)) best = s;
  return best;
}
function setsSummary(sets){
  if(!sets.length) return "Нет подходов";
  const ws = [...new Set(sets.map(s=>fmtW(s.w)))], rs = [...new Set(sets.map(s=>s.r))];
  const w = ws.length===1 ? (num(sets[0].w)>0 ? ws[0]+" кг" : "без веса") : ws.join("/")+" кг";
  return `${sets.length} × ${rs.length===1 ? rs[0] : rs.join("/")} · ${w}`;
}
function lastTimeFor(exId){
  for(const h of S.history){ const e = h.exercises.find(x=>x.exId===exId); if(e && e.sets.some(s=>s.done)) return {h, e}; }
  return null;
}
function rebuildRecords(){
  const old = S.records; S.records = {};
  for(const h of S.history.slice().reverse()) for(const e of h.exercises){
    const b = bestSet(e.sets);
    if(b && better(b, S.records[e.exId])) S.records[e.exId] = {w:b.w, r:b.r, date:h.end, name:e.name};
  }
  for(const k in old) if(!(k in S.records) && !S.history.length) delete old[k];
}
function weekStart(){ const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-(d.getDay()+6)%7); return d.getTime(); }
const tonnage = exs => exs.reduce((t,e)=>t+e.sets.filter(s=>s.done).reduce((a,s)=>a+num(s.w)*num(s.r),0),0);
const fmtTon = t => t>=1000 ? (t/1000).toFixed(1).replace(".",",")+" т" : Math.round(t)+" кг";
function canBump(e, lt){
  if(e.planNote) return false;
  if(!lt || e.bumped || e.sets.some(s=>s.done)) return false;
  const ls = lt.e.sets;
  if(!ls.length || !ls.every(s=>s.done) || ls.length < e.sets.length) return false;
  return e.sets.every((s,j)=> num(s.w)>0 && num(s.w)===num(ls[j].w) && num(ls[j].r)>=num(s.r));
}
function chart(id){
  const pts = S.history.slice().reverse().map(h=>{ const e = h.exercises.find(x=>x.exId===id); const b = e && bestSet(e.sets); return b ? {w:num(b.w)} : null; }).filter(Boolean);
  if(pts.length<2) return `<p class="muted small" style="margin:0 0 12px">График появится после второй тренировки с этим упражнением.</p>`;
  const W=300, Hh=110, p=14, mn=Math.min(...pts.map(x=>x.w)), mx=Math.max(...pts.map(x=>x.w)), rg=(mx-mn)||1;
  const xy = pts.map((q,i)=>[(p+i*(W-2*p)/(pts.length-1)).toFixed(1), (Hh-p-(q.w-mn)/rg*(Hh-2*p)).toFixed(1)]);
  return `<div style="padding:4px 0 12px"><svg viewBox="0 0 ${W} ${Hh}" width="100%" role="img" aria-label="График рабочего веса"><polyline points="${xy.map(a=>a.join(",")).join(" ")}" fill="none" stroke="var(--lime-text)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>${xy.map(a=>`<circle cx="${a[0]}" cy="${a[1]}" r="4.5" fill="var(--lime)"/>`).join("")}</svg><div class="muted small" style="display:flex;justify-content:space-between"><span>${fmtW(pts[0].w)} кг</span><span>${pts.length} тренировок</span><span>${fmtW(pts[pts.length-1].w)} кг</span></div></div>`;
}
const DUMBBELL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>';
const P = s => `<svg class="pic" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${s}</svg>`;
const H = (x,y) => `<circle cx="${x}" cy="${y}" r="3.4"/>`;
const SEAT_LEGS = '<path d="M24 31h-6v9M24 31h6v9"/>';
const ICONS = {
  bench: P('<path d="M6 35h34M10 35v6M36 35v6"/>'+H(37,30)+'<path d="M32 31H18l-6-6-2 10M30 31V17"/><path class="k" d="M18 17h22M19 12v10M39 12v10"/>'),
  incline: P('<path d="M8 39l28-15M12 37v5M33 26v16"/>'+H(34,20)+'<path d="M16 34l15-9M16 34l-5-6-3 9M30 25V13"/><path class="k" d="M25 13h10M26 10v6M34 10v6"/>'),
  shoulder: P('<path d="M14 8v34M14 33h14"/>'+H(21,14)+'<path d="M21 18v14h9v9M21 21l8-2V8"/><path class="k" d="M24 8h10"/>'),
  fly: P(H(24,12)+'<path d="M24 16v15"/>'+SEAT_LEGS+'<path d="M24 20Q14 21 11 12M24 20Q34 21 37 12"/><path class="k" d="M11 8v8M37 8v8"/>'),
  pushdown: P(H(20,10)+'<path d="M20 14v16l-4 12M20 30l4 12M20 17l6 5 4 4"/><path class="k" d="M31 4v22M26 26h9"/>'),
  row: P(H(12,16)+'<path d="M15 18l15 4-2 10 2 10M17 19l1 11"/><path class="k" d="M8 31h20M9 27v8M27 27v8"/>'),
  pulldown: P(H(24,15)+'<path d="M24 19v12"/>'+SEAT_LEGS+'<path d="M24 22l-9-4-2-8M24 22l9-4 2-8"/><path class="k" d="M8 10h32M24 10V3"/>'),
  seatrow: P(H(14,13)+'<path d="M14 17l2 15 18 2M14 21l10 3h6M38 26v14"/><path class="k" d="M30 20v8M30 24h14"/>'),
  curl: P(H(22,8)+'<path d="M22 12v16l-4 14M22 28l4 14M22 15l1 9 7-7"/><path class="k" d="M30 11v12"/>'),
  rfly: P(H(24,12)+'<path d="M24 16v15"/>'+SEAT_LEGS+'<path d="M24 20H8M24 20h16"/><path class="k" d="M8 15v10M40 15v10"/>'),
  squat: P(H(24,9)+'<path d="M22 13l-4 15 12 2-3 12h4"/><path class="k" d="M12 15h22M14 11v8M32 11v8"/>'),
  legpress: P('<path d="M6 41h12L10 22"/>'+H(11,17)+'<path d="M12 21l6 15 8-10 11 2"/><path class="k" d="M33 21l8 13"/>'),
  legcurl: P('<path d="M6 33h34M10 33v8M36 33v8"/>'+H(9,27)+'<path d="M13 29h23l-4-12"/><path class="k" d="M28 15h8"/>'),
  legext: P('<path d="M14 12v20h14"/>'+H(19,9)+'<path d="M19 13v17h11l12-3M19 17l5 8"/><path class="k" d="M41 22v9"/>'),
  rdl: P(H(12,14)+'<path d="M15 16l15 7v19M18 18l2 13"/><path class="k" d="M12 32h16M13 28v8M27 28v8"/>'),
  ohp: P(H(24,14)+'<path d="M24 18v14l-4 11M24 32l4 11M24 21l-8-5V7M24 21l8-5V7"/><path class="k" d="M10 7h28M12 3v8M36 3v8"/>'),
  pullup: P('<path class="k" d="M6 6h36"/>'+H(24,17)+'<path d="M24 21v13l-3 10M24 34l3 10M24 22l-8-8-2-8M24 22l8-8 2-8"/>'),
  lunge: P(H(22,8)+'<path d="M22 12v16l10 2v11M22 28l-8 9-4 3M22 16v10"/><path class="k" d="M18 26h8M19 23v6M25 23v6"/>'),
  calf: P(H(22,8)+'<path d="M22 12v16v10l3 3M22 16l-6-3M22 16l6-3"/><path class="k" d="M13 12h18M18 42h14"/>')
};
function iconFor(id){ for(const k in S.program){ const e = S.program[k].exercises.find(x=>x.id===id); if(e) return e.icon; } return null; }
const photoHTML = exId => S.photos[exId] ? `<img src="${S.photos[exId]}" alt="">` : (ICONS[iconFor(exId)] || DUMBBELL);
function ask(text, yes, no, onYesSync){
  return new Promise(res=>{
    const m = document.getElementById("modal"), y = document.getElementById("modalYes"), n = document.getElementById("modalNo");
    document.getElementById("modalText").textContent = text;
    y.textContent = yes || "Да";
    n.textContent = no || "Нет";
    m.classList.add("on");
    const done = v => { m.classList.remove("on"); y.onclick = n.onclick = m.onclick = null; res(v); };
    y.onclick = ()=>{ if(onYesSync) onYesSync(); done(true); };
    n.onclick = ()=>done(false);
    m.onclick = ev=>{ if(ev.target===m) done(null); };
  });
}
function toast(t){ const el = document.getElementById("toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toast._t); toast._t = setTimeout(()=>el.classList.remove("on"), 2200); }

/* ---------- render ---------- */
const app = document.getElementById("app");
function render(){
  if(S.active && view.tab==="session"){ renderSession(); return; }
  document.querySelector(".finish-bar")?.remove();
  if(view.tab==="summary") return renderSummary();
  if(view.tab==="edit") return renderEditor();
  if(view.tab==="backup") return renderBackup();
  const tabs = `<nav class="tabs" role="tablist">
    ${[["home","Тренировки"],["plan","План"],["history","История"],["records","Рекорды"]].map(([k,l])=>`<button role="tab" data-tab="${k}" aria-selected="${view.tab===k}">${l}</button>`).join("")}
  </nav>`;
  let body = "";
  if(view.tab==="home") body = renderHome();
  if(view.tab==="plan") body = renderPlan();
  if(view.tab==="history") body = renderHistory();
  if(view.tab==="records") body = renderRecords();
  app.innerHTML = tabs + body;
}

function renderHome(){
  const wd = new Date().getDay();
  const last = S.history[0];
  const banner = S.active ? `<section class="day today" style="grid-template-columns:1fr"><div class="meta"><h2>Идёт тренировка: ${esc(S.active.name)}</h2><div class="muted small">Время: ${fmtDur(Date.now()-S.active.start)}</div><div class="acts"><button class="btn btn-dark" data-tab="session">Продолжить тренировку</button></div></div></section>` : "";
  const wk = S.history.filter(h=>h.start>=weekStart()).length;
  const now = new Date(), mS = new Date(now.getFullYear(), now.getMonth(), 1).getTime(), yS = new Date(now.getFullYear(), 0, 1).getTime();
  const mo = S.history.filter(h=>h.start>=mS).length, yr = S.history.filter(h=>h.start>=yS).length;
  const tile = (n,l,hl) => `<div class="stat ${hl?"hl":""}"><b>${n}</b><span>${l}</span></div>`;
  return banner + `<div class="stats">${tile(wk+"/3","неделя",wk>=3)}${tile(mo,"месяц")}${tile(yr,"год")}${tile(S.history.length,"всего")}</div><p class="muted small" style="margin:0 0 14px">${planWeek() ? `<b style="color:var(--lime-text)">Неделя ${planWeek()} из 12${weekTag(planWeek()) ? " · "+weekTag(planWeek()) : ""}</b> · ` : ""}${wk>=3?"Неделя выполнена 🔥 · ":""}${last ? `Последняя тренировка: ${esc(fmtDate(last.start))}` : "Пока ни одной тренировки — начнём?"}</p>` +
  DAYS.map(d=>{
    const p = S.program[d.id];
    const today = d.wd===wd;
    return `<section class="day ${today?"today":""}">
      <div class="dow">${d.short}<small>${today?"сегодня":""}</small></div>

function downloadBackup(json){
  const name = "mmfitness-" + new Date().toISOString().slice(0,10) + ".json";
  try{
    const f = new File([json], name, {type:"application/json"});
    if(navigator.canShare && navigator.canShare({files:[f]})){ navigator.share({files:[f]}).catch(()=>{}); return; }
  }catch(e){}
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([json],{type:"application/json"})); a.download = name; document.body.appendChild(a); a.click(); a.remove();

async function importJSON(txt){
  let data; try{ data = JSON.parse(txt); }catch(e){ toast("Не удалось прочитать копию"); return; }
  if(!data || !data.program || !Array.isArray(data.history)){ toast("Это не копия ММ.ФИТНЕС"); return; }
  if(!(await ask(`Восстановить копию (${data.history.length} тренировок)? Текущие данные будут заменены.`, "Восстановить"))) return;
  const oldIds = S.history.map(h=>h.id);
  S = Object.assign(defaultState(), {program:data.program, programVersion:data.programVersion||PROGRAM_VERSION, records:data.records||{}, planStart:data.planStart||weekStart(), history:data.history, photos:data.photos||{}, active:null});
  stopRest(); saveMain(); lsSave();
  if(db){
    try{
      for(const id of oldIds) if(!S.history.some(h=>h.id===id)) await db.doc(base+"/h_"+id).delete();
      for(const h of S.history) await saveHistoryEntry(h);

}

function renderPlan(){
  const cur = planWeek(), DOFF = {mon:0, wed:2, fri:4};
  if(view.openWeek == null) view.openWeek = cur || 1;
  const dayKey = ts => new Date(ts).toDateString();
  const doneDays = new Set(S.history.map(h=>h.dayId+"|"+dayKey(h.start)));
  const today = new Date(); today.setHours(0,0,0,0);
  let out = `<div class="card"><h2>12 недель: масса + сила</h2>
    <p class="muted small" style="margin:6px 0 0">Цель к 12-й неделе: жим лёжа 70 кг × 5, присед 75 кг × 5, подтягивания 3 × 12. Неделя 7 — разгрузка, неделя 12 — проверка.</p></div>`;
  for(let wk=1; wk<=PLAN_WEEKS; wk++){
    const ws = S.planStart + (wk-1)*7*864e5, we = ws + 6*864e5;
    const open = view.openWeek===wk, tag = weekTag(wk);
    const dots = DAYS.map(d=>{
      const dt = new Date(ws + DOFF[d.id]*864e5);

      <button class="wk-head" data-week="${wk}" aria-expanded="${open}">
        <div><b>Неделя ${wk}</b>${tag?`<span class="badge">${tag}</span>`:""}${wk===cur?'<span class="badge dark">сейчас</span>':""}
        <div class="muted small">${new Date(ws).toLocaleDateString("ru-RU",{day:"numeric",month:"short"})} – ${new Date(we).toLocaleDateString("ru-RU",{day:"numeric",month:"short"})}</div></div>
        <div class="dots">${dots}</div>
      </button>
      ${open ? DAYS.map(d=>`<div class="wk-day"><b>${d.full} · ${esc(S.program[d.id].name)}</b>${S.program[d.id].exercises.map(e=>`<div class="wk-ex"><span>${esc(e.name)}</span><span>${esc(planText(e, wk))}</span></div>`).join("")}</div>`).join("") : ""}

  out += `<div class="row-acts" style="margin-top:14px"><button class="btn btn-ghost" data-replan>Начать план заново с этой недели</button></div>`;

/* ---------- session logic ---------- */
function startWorkout(dayId){
  const p = S.program[dayId];
  if(S.active){ toast("Сначала завершите текущую тренировку"); return; }
  if(!p.exercises.length){ toast("Добавьте упражнения в эту тренировку"); return; }
  S.active = {id:uid(), dayId, name:p.name, start:Date.now(),
    exercises:p.exercises.map(e=>{
      const wk = planWeek(), pf = planFor(e, wk);
      const sets = pf ? Array.from({length:pf.sets},(_,j)=>({w:pf.w==="" ? (e.sets[j]||e.sets[0]||{w:""}).w : String(pf.w).replace(".",","), r:String(pf.r), done:false}))
                      : e.sets.map(s=>({w:s.w, r:s.r, done:false}));
      return {exId:e.id, name:e.name, rest:e.rest||REST_SET, done:false, sets,
        planNote: pf ? `План · неделя ${wk}${weekTag(wk) ? " ("+weekTag(wk)+")" : ""}: ${planText(e, wk)}` : ""};
    })};
  view.openEx = S.active.exercises[0].exId; view.tab = "session";
  saveMain(); render(); window.scrollTo(0,0); keepAwake();
}

async function finishWorkout(){
  const a = S.active;
  const anyDone = a.exercises.some(e=>e.sets.some(s=>s.done));
  if(!(await ask(anyDone ? "Завершить тренировку?" : "Ни один подход не отмечен. Всё равно завершить?", "Завершить"))) return;
  stopRest(); releaseAwake();
  const end = Date.now(), recs = [];
  for(const e of a.exercises){
    const b = bestSet(e.sets);
    if(b && better(b, S.records[e.exId])){
      const isFirst = !S.records[e.exId];
      S.records[e.exId] = {w:b.w, r:b.r, date:end, name:e.name};
      if(!isFirst) recs.push(e.exId);
    }
    // remember what was done as next time's plan
    const pe = S.program[a.dayId].exercises.find(x=>x.id===e.exId);
    if(pe && e.sets.some(s=>s.done)) pe.sets = e.sets.map(s=>({w:s.w, r:s.r}));
  }
  const h = {id:a.id, dayId:a.dayId, name:a.name, start:a.start, end, exercises:a.exercises, records:recs};
  S.history.unshift(h);
  S.active = null;
  view = {tab:"summary", summaryId:h.id, openEx:null};
  saveMain(); await saveHistoryEntry(h);
  render(); window.scrollTo(0,0);
}

let wl = null;
async function keepAwake(){ try{ if(S.active && !wl && navigator.wakeLock && document.visibilityState==="visible"){ wl = await navigator.wakeLock.request("screen"); wl.addEventListener("release", ()=>{ wl = null; }); } }catch(e){} }
function releaseAwake(){ try{ if(wl) wl.release(); }catch(e){} wl = null; }
document.addEventListener("visibilitychange", ()=>{ keepAwake(); if(document.visibilityState==="visible" && restEl.classList.contains("on")) tickRest(); });

/* ---------- rest timer ---------- */
let rest = {end:0, total:0, int:null, beeped:false};
const restEl = document.getElementById("rest");
function startRest(sec, label){
  rest.end = Date.now()+sec*1000; rest.total = sec*1000; rest.beeped = false;
  document.getElementById("restL").textContent = label;
  restEl.classList.add("on"); restEl.classList.remove("over");
  clearInterval(rest.int); rest.int = setInterval(tickRest, 250); tickRest();
  syncFinishBar();
}
function tickRest(){
  const left = rest.end - Date.now();
  document.getElementById("restT").textContent = left>0 ? fmtDur(left+999) : "0:00";
  document.getElementById("restBar").style.width = Math.max(0, left/rest.total*100)+"%";
  if(left<=0 && !rest.beeped){
    rest.beeped = true; restEl.classList.add("over");
    document.getElementById("restL").textContent = "Отдых окончен — за работу!";
    beep(); if(navigator.vibrate) navigator.vibrate([300,150,300]);
    setTimeout(()=>{ if(rest.beeped && Date.now()-rest.end>8000) stopRest(); }, 9000);
  }
}
function stopRest(){ clearInterval(rest.int); restEl.classList.remove("on","over"); syncFinishBar(); }
let actx = null;
function beep(){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    [0,0.3,0.6].forEach(t=>{
      const o = actx.createOscillator(), g = actx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(.25, actx.currentTime+t); g.gain.exponentialRampToValueAtTime(.001, actx.currentTime+t+.25);
      o.start(actx.currentTime+t); o.stop(actx.currentTime+t+.26);
    });
  }catch(e){}
}
document.getElementById("restSkip").onclick = stopRest;
document.getElementById("restPlus").onclick = ()=>{ rest.end = Math.max(rest.end, Date.now()) + 30000; rest.total += 30000; rest.beeped=false; restEl.classList.remove("over"); };

setInterval(()=>{ const c = document.getElementById("clock"); if(c && S.active) c.textContent = fmtDur(Date.now()-S.active.start); }, 1000);

/* ---------- photo upload ---------- */
let photoFor = null;
const photoInput = document.getElementById("photoInput");
photoInput.onchange = ()=>{
  const f = photoInput.files[0]; photoInput.value = "";
  if(!f || !photoFor) return;
  const img = new Image(), url = URL.createObjectURL(f);
  img.onload = ()=>{
    const s = 240, c = document.createElement("canvas"); c.width = c.height = s;
    const m = Math.min(img.width, img.height);
    c.getContext("2d").drawImage(img, (img.width-m)/2, (img.height-m)/2, m, m, 0, 0, s, s);
    S.photos[photoFor] = c.toDataURL("image/jpeg", .72);
    URL.revokeObjectURL(url); savePhoto(photoFor); render();
  };
  img.src = url;
};

/* ---------- events ---------- */
document.addEventListener("click", async e=>{
  const t = e.target.closest("button"); if(!t) return;
  const d = t.dataset;
  if(actx && actx.state==="suspended") actx.resume();
  if(d.tab){ view.tab = d.tab; view.openHist=null; render(); window.scrollTo(0,0); return; }
  if(d.start){ try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); }catch(_){} startWorkout(d.start); return; }
  if(d.edit){ view.tab="edit"; view.editDay=d.edit; render(); window.scrollTo(0,0); return; }
  if("back" in d){ view.tab="home"; render(); return; }
  if("exportfile" in d){ downloadBackup(exportJSON()); return; }
  if("exportcopy" in d){
    const ta = document.getElementById("bk"); ta.value = exportJSON(); ta.style.display = "block"; ta.focus(); ta.select();
    try{ await navigator.clipboard.writeText(ta.value); toast("Копия скопирована — вставьте её в Заметки"); }catch(_){ toast("Текст выделен — нажмите «Скопировать»"); }
    return;
  }
  if("importfile" in d){ document.getElementById("backupInput").click(); return; }
  if("importtext" in d){ importJSON(document.getElementById("bkin").value); return; }
  if(d.week){ view.openWeek = view.openWeek===+d.week ? 0 : +d.week; render(); return; }
  if("replan" in d){ if(await ask("Начать 12-недельный план заново? Неделя 1 начнётся с этого понедельника.", "Начать")){ S.planStart = weekStart(); view.openWeek = 1; saveMain(); render(); toast("План запущен с этой недели"); } return; }
  if(d.rec){ view.openRec = view.openRec===d.rec ? null : d.rec; render(); return; }
  if(d.hist){ view.openHist = view.openHist===d.hist ? null : d.hist; render(); return; }
  if(d.delhist){
    const h = S.history.find(x=>x.id===d.delhist);
    if(await ask(`Удалить тренировку «${h.name}» от ${fmtDate(h.start)}?`, "Удалить")){
      S.history = S.history.filter(x=>x.id!==d.delhist); rebuildRecords();
      deleteHistoryEntry(d.delhist); saveMain(); render(); toast("Тренировка удалена");
    }
    return;
  }

  // photos (editor and workout)
  if(d.photo){
    photoFor = d.photo;
    if(!S.photos[d.photo]){ photoInput.click(); return; }
    const r = await ask("Фото упражнения", "Выбрать новое", "Вернуть схему", ()=>photoInput.click());
    if(r===false){ delete S.photos[photoFor]; savePhoto(photoFor); render(); toast("Вернули схему"); }
    return;
  }

  // editor
  if(view.tab==="edit"){
    const ex = S.program[view.editDay].exercises;
    if(d.up){ const i=+d.up; [ex[i-1],ex[i]]=[ex[i],ex[i-1]]; saveMain(); render(); return; }
    if(d.down){ const i=+d.down; [ex[i+1],ex[i]]=[ex[i],ex[i+1]]; saveMain(); render(); return; }
    if(d.rm){ const it = ex.find(x=>x.id===d.rm); if(await ask(`Удалить «${it.name}»?`, "Удалить")){ ex.splice(ex.indexOf(it),1); saveMain(); render(); } return; }
    if("addex" in d){ ex.push(mk("Новое упражнение")); saveMain(); render(); const ins = document.querySelectorAll("[data-rename]"); const last = ins[ins.length-1]; last.focus(); last.select(); return; }
  }

  // session
  const a = S.active; if(!a) return;
  if(d.open){ view.openEx = view.openEx===d.open ? null : d.open; render(); return; }
  if(d.done){
    const [i,j] = d.done.split(":").map(Number), ex = a.exercises[i], s = ex.sets[j];
    s.done = !s.done;
    if(s.done){
      const rec = S.records[ex.exId];
      if(rec && better(s, rec)) toast(`Новый рекорд: ${fmtW(s.w)} кг × ${s.r} 🏆`);
      const allDone = ex.sets.every(x=>x.done);
      if(allDone){ ex.done = true; startRest(REST_EX, "Отдых перед следующим упражнением"); openNext(i); }
      else startRest(ex.rest||REST_SET, `Отдых между подходами · дальше подход ${ex.sets.findIndex(x=>!x.done)+1}`);
    } else { stopRest(); ex.done = false; }
    saveMain(); render(); return;
  }
  if(d.bump){ const ex = a.exercises[+d.bump]; ex.sets.forEach(s=>{ if(num(s.w)>0) s.w = fmtW(num(s.w)+2.5); }); ex.bumped = true; toast("Вес увеличен на 2,5 кг 💪"); saveMain(); render(); return; }
  if(d.delset){ const [i,j] = d.delset.split(":").map(Number); a.exercises[i].sets.splice(j,1); saveMain(); render(); return; }
  if(d.addset){ const ex = a.exercises[+d.addset], l = ex.sets[ex.sets.length-1]; ex.sets.push({w:l?l.w:"", r:l?l.r:"10", done:false}); ex.done=false; saveMain(); render(); return; }
  if(d.exdone){
    const i = +d.exdone, ex = a.exercises[i]; ex.done = !ex.done;
    if(ex.done){ startRest(REST_EX, "Отдых перед следующим упражнением"); openNext(i); }
    saveMain(); render(); return;
  }
  if("finish" in d){ finishWorkout(); return; }
  if("cancel" in d){ if(await ask("Отменить тренировку? Отмеченные подходы не сохранятся.", "Отменить")){ S.active=null; stopRest(); releaseAwake(); view.tab="home"; saveMain(); render(); } return; }
});
function openNext(i){
  const nx = S.active.exercises.find((x,k)=>k>i && !x.done) || S.active.exercises.find(x=>!x.done);
  view.openEx = nx ? nx.exId : null;
}

document.addEventListener("input", e=>{
  const t = e.target, d = t.dataset;
  if(d.w || d.r){
    const [i,j] = (d.w||d.r).split(":").map(Number);
    const s = S.active.exercises[i].sets[j];
    if(d.w) s.w = t.value.replace(/[^\d.,]/g,""); else s.r = t.value.replace(/\D/g,"");
    const sum = t.closest(".ex").querySelector(".sum"); if(sum) sum.textContent = setsSummary(S.active.exercises[i].sets);
    saveMain(); return;
  }
  if(d.rest){ const ex = S.program[view.editDay].exercises.find(x=>x.id===d.rest); ex.rest = +t.value; saveMain(); return; }
  if(d.rename){ const ex = S.program[view.editDay].exercises.find(x=>x.id===d.rename); ex.name = t.value; saveMain(); return; }
  if(t.id==="dname"){ S.program[view.editDay].name = t.value || "Тренировка"; saveMain(); }
});

init();
})();
</script>
</body>
</html>
